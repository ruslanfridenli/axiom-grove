<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiom Grove — Generative Botanicals</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>❦ axiom grove</h1>
  <nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav>
</header>
<main>
  <aside class="panel">
    <section>
      <h2 data-i="preset">Preset</h2>
      <div class="btncol" id="presets"></div>
    </section>
    <section>
      <h2 data-i="params">Parameters</h2>
      <label><span data-i="iterations">Iterations</span><span id="it-val"></span>
        <input type="range" id="it" min="1" max="7" step="1"></label>
      <label><span data-i="angle">Angle</span><span id="an-val"></span>
        <input type="range" id="an" min="5" max="45" step="0.5"></label>
      <label><span data-i="random">Randomness</span><span id="ra-val"></span>
        <input type="range" id="ra" min="0" max="30" step="1"></label>
      <label><span data-i="width">Branch width</span><span id="wi-val"></span>
        <input type="range" id="wi" min="1" max="10" step="0.5"></label>
      <label><span data-i="hue">Hue</span><span id="hu-val"></span>
        <input type="range" id="hu" min="0" max="360" step="1"></label>
      <label class="check"><input type="checkbox" id="leaf" checked> <span data-i="leaves">Leaves</span></label>
    </section>
    <section>
      <h2 data-i="seed">Seed</h2>
      <div class="seedrow">
        <input type="number" id="seed" value="7">
        <button id="dice" title="random seed">⚄</button>
      </div>
    </section>
    <div class="btncol">
      <button id="regen" class="primary" data-i="regen">↻ Regenerate</button>
      <button id="png" data-i="png">⤓ Export PNG</button>
    </div>
  </aside>
  <canvas id="cv"></canvas>
</main>
<script src="app.js"></script>
</body>
</html>
